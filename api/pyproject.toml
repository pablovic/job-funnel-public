[project]
name = "job-funnel-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "anthropic>=0.40",
  "httpx>=0.27",
  "typer>=0.13",
  "pyyaml>=6.0",
  "scipy>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
funnel = "app.cli:cli"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110

# El paquete es solo `app`. Sin esto, setuptools ve tambien la carpeta `db`
# (los .sql) como si fuera un paquete, y `pip install -e ./api` falla en
# cualquier maquina limpia -- por ejemplo, en GitHub Actions.
[tool.setuptools.packages.find]
include = ["app*"]
